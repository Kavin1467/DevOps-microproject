version: '3.8'

services:
  # E-Commerce Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://ecommerce:ecommerce_secret@postgres:5432/ecommerce_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # PostgreSQL Relational Database Service
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_secret
      POSTGRES_DB: ecommerce_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # Jenkins CI/CD Controller Service
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: ecommerce-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ecommerce-net

volumes:
  postgres_data:
    driver: local
  jenkins_home:
    driver: local

networks:
  ecommerce-net:
    driver: bridge
